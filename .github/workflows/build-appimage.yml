name: Build Linux AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            ca-certificates \
            curl \
            file \
            desktop-file-utils \
            rpm \
            libvulkan-dev \
            libpipewire-0.3-dev \
            libportal-dev \
            libglib2.0-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libdrm-dev

      - name: Validate desktop entry and installer script
        run: |
          desktop-file-validate assets/lfg-linux.desktop
          bash -n install.sh

      - name: Build LWFG and stage AppDir
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Build .deb and .rpm packages
        run: |
          mkdir -p dist
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VERSION="0.1.5"
          fi
          RPM_VERSION="$(printf '%s' "$RAW_VERSION" | tr '-' '~')"

          cpack --config build/CPackConfig.cmake -G DEB \
            -D CPACK_PACKAGE_DIRECTORY="$PWD/dist" \
            -D CPACK_PACKAGE_VERSION="$RAW_VERSION" \
            -D CPACK_DEBIAN_FILE_NAME="LWFG-${RAW_VERSION}-amd64.deb"

          cpack --config build/CPackConfig.cmake -G RPM \
            -D CPACK_PACKAGE_DIRECTORY="$PWD/dist" \
            -D CPACK_PACKAGE_VERSION="$RPM_VERSION" \
            -D CPACK_RPM_FILE_NAME="LWFG-${RAW_VERSION}-x86_64.rpm"

          dpkg-deb --info "dist/LWFG-${RAW_VERSION}-amd64.deb"
          dpkg-deb --contents "dist/LWFG-${RAW_VERSION}-amd64.deb"
          rpm -qpi "dist/LWFG-${RAW_VERSION}-x86_64.rpm"
          rpm -qpl "dist/LWFG-${RAW_VERSION}-x86_64.rpm"

      - name: Populate AppDir dependencies with linuxdeploy
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/lfg \
            --desktop-file AppDir/usr/share/applications/lfg-linux.desktop \
            --icon-file assets/lfg-linux.png

      - name: Prune host-coupled libraries from AppDir
        run: |
          if [ -d AppDir/usr/lib ]; then
            find AppDir/usr/lib -maxdepth 2 \( \
              -name 'libvulkan*' -o \
              -name 'libpipewire*' -o \
              -name 'libspa*' -o \
              -name 'libdrm*' -o \
              -name 'libGL*' -o \
              -name 'libEGL*' -o \
              -name 'libgbm*' -o \
              -name 'libwayland*' -o \
              -name 'libglib-2.0*' -o \
              -name 'libgio-2.0*' -o \
              -name 'libgobject-2.0*' -o \
              -name 'libgmodule-2.0*' -o \
              -name 'libgthread-2.0*' -o \
              -name 'libdbus*' -o \
              -name 'libsystemd*' -o \
              -name 'libmount*' -o \
              -name 'libblkid*' -o \
              -name 'libselinux*' -o \
              -name 'libpcre*' -o \
              -name 'libffi*' -o \
              -name 'libz.so*' -o \
              -name 'libstdc++*' -o \
              -name 'libgcc_s*' \
            \) -delete
          fi
          ls -la AppDir/usr/lib || true
          ldd AppDir/usr/bin/lfg

      - name: Install self-integrating AppRun and root AppDir icons
        run: |
          cp -f assets/lfg-linux.png AppDir/lfg-linux.png
          ln -sf lfg-linux.png AppDir/.DirIcon
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu

          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          APP_DIR="${HOME:-}/.local/share/applications"
          DESKTOP_FILE="$APP_DIR/lfg-linux.desktop"
          ICON_128="${HOME:-}/.local/share/icons/hicolor/128x128/apps/lfg-linux.png"
          ICON_32="${HOME:-}/.local/share/icons/hicolor/32x32/apps/lfg-linux.png"
          PIXMAP="${HOME:-}/.local/share/pixmaps/lfg-linux.png"

          refresh_caches() {
              if command -v update-desktop-database >/dev/null 2>&1; then
                  update-desktop-database "$APP_DIR" >/dev/null 2>&1 || true
              fi
              if command -v gtk-update-icon-cache >/dev/null 2>&1; then
                  gtk-update-icon-cache -f -t "${HOME}/.local/share/icons/hicolor" >/dev/null 2>&1 || true
              fi
              if command -v kbuildsycoca6 >/dev/null 2>&1; then
                  kbuildsycoca6 --noincremental >/dev/null 2>&1 || true
              elif command -v kbuildsycoca5 >/dev/null 2>&1; then
                  kbuildsycoca5 --noincremental >/dev/null 2>&1 || true
              fi
          }

          integrate_desktop() {
              [ -n "${APPIMAGE:-}" ] && [ -f "$APPIMAGE" ] && [ -n "${HOME:-}" ] && [ -w "$HOME" ] || return 0
              if [ -f "$DESKTOP_FILE" ] && grep -Fqx "TryExec=$APPIMAGE" "$DESKTOP_FILE" 2>/dev/null; then
                  return 0
              fi

              mkdir -p "$APP_DIR" \
                  "$(dirname -- "$ICON_128")" \
                  "$(dirname -- "$ICON_32")" \
                  "$(dirname -- "$PIXMAP")" 2>/dev/null || return 0

              if [ -f "$HERE/usr/share/icons/hicolor/128x128/apps/lfg-linux.png" ]; then
                  cp -f "$HERE/usr/share/icons/hicolor/128x128/apps/lfg-linux.png" "$ICON_128" 2>/dev/null || true
                  cp -f "$HERE/usr/share/icons/hicolor/128x128/apps/lfg-linux.png" "$PIXMAP" 2>/dev/null || true
              fi
              if [ -f "$HERE/usr/share/icons/hicolor/32x32/apps/lfg-linux.png" ]; then
                  cp -f "$HERE/usr/share/icons/hicolor/32x32/apps/lfg-linux.png" "$ICON_32" 2>/dev/null || true
              fi

              EXEC_PATH="$(printf '%s\n' "$APPIMAGE" | sed 's/\\/\\\\/g; s/"/\\"/g; s/`/\\`/g; s/\$/\\$/g')"
              cat > "$DESKTOP_FILE" <<DESKTOP_EOF || return 0
          [Desktop Entry]
          Type=Application
          Name=LWFG
          GenericName=Linux Windowed Frame Generation
          Comment=LWFG (Linux Windowed Frame Generation) — Lossless Scaling LSFG 3.1 Overlay for Linux
          TryExec=$APPIMAGE
          Exec="$EXEC_PATH"
          Icon=$ICON_128
          StartupWMClass=lfg-linux
          Terminal=false
          Categories=Game;Utility;
          Keywords=lwfg;lfg;frame;generation;lossless;scaling;vulkan;fps;adaptive;lsfg;
          Actions=ToggleFG;QuitFG;

          [Desktop Action ToggleFG]
          Name=Start / Stop Frame Generation
          Exec="$EXEC_PATH" --toggle

          [Desktop Action QuitFG]
          Name=Quit LWFG
          Exec="$EXEC_PATH" --quit
          DESKTOP_EOF
              refresh_caches &
          }

          uninstall_desktop() {
              [ -n "${HOME:-}" ] || return 0
              rm -f "$DESKTOP_FILE" "$ICON_128" "$ICON_32" "$PIXMAP"
              refresh_caches
          }

          case "${1:-}" in
              --install-desktop)
                  integrate_desktop
                  wait
                  exit 0
                  ;;
              --uninstall-desktop)
                  uninstall_desktop
                  exit 0
                  ;;
          esac

          if [ "${LWFG_NO_INTEGRATE:-0}" != "1" ]; then
              case "${1:-}" in
                  --help|-h|--stop|--quit|--toggle) ;;
                  *) integrate_desktop ;;
              esac
          fi

          exec "$HERE/usr/bin/lfg" "$@"
          EOF
          chmod +x AppDir/AppRun
          sh -n AppDir/AppRun

      - name: Build and smoke-test AppImage and terminal installer
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool-x86_64.AppImage --no-appstream AppDir dist/LWFG-x86_64.AppImage
          (cd dist && sha256sum LWFG-x86_64.AppImage LWFG-*.deb LWFG-*.rpm > SHA256SUMS.txt)

          ./dist/LWFG-x86_64.AppImage --appimage-extract-and-run --help

          HOME=/tmp/test-appimage ./dist/LWFG-x86_64.AppImage --appimage-extract-and-run --install-desktop
          desktop-file-validate /tmp/test-appimage/.local/share/applications/lfg-linux.desktop
          test -f /tmp/test-appimage/.local/share/icons/hicolor/128x128/apps/lfg-linux.png
          HOME=/tmp/test-appimage ./dist/LWFG-x86_64.AppImage --appimage-extract-and-run --uninstall-desktop
          test ! -e /tmp/test-appimage/.local/share/applications/lfg-linux.desktop

          LWFG_APPIMAGE_PATH="$PWD/dist/LWFG-x86_64.AppImage" HOME=/tmp/test-installer bash ./install.sh
          desktop-file-validate /tmp/test-installer/.local/share/applications/lfg-linux.desktop
          test -f /tmp/test-installer/.local/share/icons/hicolor/128x128/apps/lfg-linux.png
          /tmp/test-installer/.local/bin/lwfg --help
          HOME=/tmp/test-installer bash ./install.sh --uninstall
          test ! -e /tmp/test-installer/.local/share/applications/lfg-linux.desktop

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwfg-linux-packages
          path: dist/*

  publish-release:
    needs: build-appimage
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux packages artifact
        uses: actions/download-artifact@v4
        with:
          name: lwfg-linux-packages
          path: dist

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
